<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>针法库 · 针语</title>
<link rel="stylesheet" href="/assets/theme.css?v=3">
</head>
<body data-page="stitches">
<main class="container">
  <h1 class="page-title">湘绣针法库</h1>
  <p class="lead">了解针法的适用题材、操作要点与资料来源。</p>

  <div class="card mb-6 mt-5">
    <label for="family" class="small" style="font-weight:600">按类别筛选</label>
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px" id="families"></div>
  </div>

  <div class="grid-auto" id="list"></div>

  <div class="card" id="detail" style="display:none"></div>
</main>

<script src="/assets/app.js?v=3"></script>
<script>
(function () {
  const { api, esc, toast, reviewBadge } = window.ZY;
  window.ZY.renderChrome('/stitches');

  let currentFamily = '';

  function load(family) {
    document.getElementById('list').innerHTML = Array.from({length: 4}).map(() =>
      '<div class="card"><div class="skel" style="height:120px"></div></div>').join('');
    api.get('/stitches', { family: family || '' }).then(d => {
      const opts = [['', '全部']].concat(d.families.map(f => [f, f]));
      document.getElementById('families').innerHTML = opts.map(([val, label]) =>
        `<button class="chip" type="button" data-f="${esc(val)}"
           aria-pressed="${(currentFamily || '') === val ? 'true' : 'false'}">${esc(label)}</button>`
      ).join('');
      document.querySelectorAll('#families [data-f]').forEach(b => b.addEventListener('click', () => {
        currentFamily = b.getAttribute('data-f'); load(currentFamily);
      }));
      if (!d.items.length) { document.getElementById('list').innerHTML = '<p class="muted">暂无针法</p>'; return; }
      document.getElementById('list').innerHTML = d.items.map(s => `
        <div class="card">
          <div class="row-between"><div class="card-title" style="margin:0">${esc(s.name)}</div>${reviewBadge(s.review_status)}</div>
          <div class="row small muted gap-2 row-wrap mb-2">
            <span class="chip">${esc(s.family)}</span>
            <span>难度 ${'★'.repeat(s.difficulty)}${'☆'.repeat(5 - s.difficulty)}</span>
            ${s.alias ? `<span>别名：${esc(s.alias)}</span>` : ''}
          </div>
          <p class="small muted">${esc(s.summary.slice(0, 96))}…</p>
          <div class="row gap-2">
            <button class="btn btn-outline btn-sm" data-code="${esc(s.code)}">看详情</button>
            <button class="btn btn-ghost btn-sm" data-ask="${esc(s.name)}适合什么题材？">问知识库</button>
          </div>
        </div>`).join('');
      bind();
    }).catch(e => toast(e.message, 'error'));
  }

  function bind() {
    document.querySelectorAll('#list [data-code]').forEach(b => b.addEventListener('click', () => {
      const code = b.getAttribute('data-code');
      api.get('/stitches/' + encodeURIComponent(code)).then(s => {
        const el = document.getElementById('detail');
        el.style.display = 'block';
        el.classList.add('mt-8');
        el.innerHTML = `
          <div class="row-between"><h2 style="margin:0">${esc(s.name)}</h2>${reviewBadge(s.review_status)}</div>
          <p class="small muted">${esc(s.alias || '')} · ${esc(s.family)} · 难度 ${s.difficulty}/5</p>
          <p>${esc(s.summary)}</p>
          <h3 class="subhead">适合题材</h3>
          <p class="small muted">${esc(s.suitable_for)}</p>
          <h3 class="subhead">操作要点</h3>
          <ol class="small">${s.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
          ${s.tips ? `<div class="notice">提示：${esc(s.tips)}</div>` : ''}
          <h3 class="subhead">推荐理由</h3>
          ${s.rules.length ? s.rules.map(r => `<div class="list-item small"><strong>${esc(r.feature)}</strong>${reviewBadge(r.review_status)}<div class="muted">${esc(r.rationale)}</div></div>`).join('')
            : '<p class="small muted">暂无推荐理由</p>'}
          <h3 class="subhead">相关问答</h3>
          ${s.related_knowledge.length ? s.related_knowledge.map(k =>
            `<div class="list-item small"><a href="/knowledge">${esc(k.question)}</a> ${reviewBadge(k.review_status)}</div>`).join('')
            : '<p class="small muted">还没有关联条目</p>'}
          <h3 class="subhead">来源</h3>
          <ul class="small muted">${s.sources.map(x => `<li>${esc(x.title)}${x.url ? ` · <span style="word-break:break-all">${esc(x.url)}</span>` : ''}</li>`).join('')}</ul>`;
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }).catch(e => toast(e.message, 'error'));
    }));
    document.querySelectorAll('#list [data-ask]').forEach(b => b.addEventListener('click', () => {
      sessionStorage.setItem('zy_ask', b.getAttribute('data-ask'));
      location.href = '/knowledge';
    }));
  }

  load('');
})();
</script>
</body>
</html>
