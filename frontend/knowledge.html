<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>湘绣知识问答 · 针语</title>
<link rel="stylesheet" href="/assets/theme.css?v=3">
</head>
<body data-page="knowledge">
<main class="container">
  <h1 class="page-title">湘绣知识问答</h1>
  <p class="lead">提问湘绣相关问题，查看有来源的回答；没有可靠资料时，会明确告诉你。</p>

  <div class="card">
    <div class="field">
      <label for="q">你想问什么？</label>
      <textarea id="q" class="textarea" placeholder="例如：掺针为什么适合做渐变？"></textarea>
    </div>
    <div id="preset" class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:16px">
      <button class="chip" type="button" data-q="掺针的主要作用是什么？">掺针的作用</button>
      <button class="chip" type="button" data-q="针法推荐是 AI 自己想出来的吗？">针法建议可靠吗</button>
      <button class="chip" type="button" data-q="平台生成的图能当成成品绣品吗？">生成图能当成品吗</button>
      <button class="chip" type="button" data-q="初学者先学哪种针法">入门顺序</button>
    </div>
    <button id="ask" class="btn btn-primary">提问</button>
  </div>

  <section id="answer-box" style="display:none;margin-top:24px">
    <div class="card">
      <div id="answer"></div>
    </div>
  </section>

  <section class="section" style="padding-bottom:0">
    <div class="row-between" style="margin-bottom:16px">
      <h2 style="margin:0">知识条目</h2>
      <span id="kb-stat" class="small muted"></span>
    </div>
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:16px" id="cats"></div>
    <div id="entries" class="grid-auto"></div>
  </section>
</main>

<script src="/assets/app.js?v=3"></script>
<script>
(function () {
  const { api, esc, toast, reviewBadge } = window.ZY;
  window.ZY.renderChrome('/knowledge');

  const answerEl = document.getElementById('answer');
  const box = document.getElementById('answer-box');

  const preset = sessionStorage.getItem('zy_ask');
  if (preset) { document.getElementById('q').value = preset; sessionStorage.removeItem('zy_ask'); }

  document.getElementById('preset').addEventListener('click', e => {
    const v = e.target.getAttribute('data-q');
    if (v) document.getElementById('q').value = v;
  });

  document.getElementById('ask').addEventListener('click', () => {
    const q = document.getElementById('q').value.trim();
    if (!q) { toast('请输入问题', 'error'); return; }
    answerEl.innerHTML = '<div class="skel" style="height:120px"></div>';
    box.style.display = 'block';
    api.post('/knowledge/ask', { question: q }).then(d => {
      answerEl.innerHTML = `
        <div class="row-between" style="align-items:flex-start">
          <h3 style="margin:0;flex:1">${esc(d.question)}</h3>
          ${reviewBadge(d.review_status)}
        </div>
        <p style="white-space:pre-wrap;margin-top:16px">${esc(d.answer)}</p>
        ${d.sources && d.sources.length ? `<div class="small muted" style="margin-top:12px">来源：${d.sources.map(s => esc(s.title)).join('；')}</div>` : ''}
        ${d.confident && d.hits.length ? `<details style="margin-top:16px"><summary class="small muted">查看相关条目</summary>
          <div style="margin-top:12px">${d.hits.map(h => `<div class="list-item small"><strong>${esc(h.question)}</strong> ${reviewBadge(h.review_status)}</div>`).join('')}</div>
        </details>` : ''}`;
    }).catch(e => { answerEl.innerHTML = `<div class="notice notice-error">${esc(e.message)}</div>`; });
  });

  api.get('/knowledge/categories').then(c => {
    document.getElementById('kb-stat').innerHTML =
      `共 ${c.total} 条 · 已确认 ${c.confirmed} · 待确认 ${c.pending}`;
    document.getElementById('cats').innerHTML =
      '<button class="chip" data-c="" style="cursor:pointer">全部</button>' +
      c.categories.map(x => `<button class="chip" data-c="${esc(x.category)}" style="cursor:pointer">${esc(x.category)} ${x.count}</button>`).join('');
    document.querySelectorAll('#cats [data-c]').forEach(b => b.addEventListener('click', () => {
      loadEntries(b.getAttribute('data-c'));
    }));
    loadEntries('');
  }).catch(() => {});

  function loadEntries(cat) {
    api.get('/knowledge/search', { category: cat, limit: 24 }).then(d => {
      const el = document.getElementById('entries');
      if (!d.items.length) { el.innerHTML = '<p class="muted">暂无条目</p>'; return; }
      el.innerHTML = d.items.map(i => `
        <div class="card card-tight">
          <div class="row-between" style="align-items:flex-start">
            <div style="font-weight:600;flex:1">${esc(i.question)}</div>${reviewBadge(i.review_status)}
          </div>
          <p class="small muted" style="margin:8px 0 0">${esc(String(i.answer).slice(0, 100))}…</p>
          <div class="row small" style="gap:8px;flex-wrap:wrap;margin-top:8px">
            <span class="chip">${esc(i.category)}</span>
            <button class="btn btn-ghost btn-sm" data-q="${esc(i.question)}">提问</button>
          </div>
        </div>`).join('');
      el.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
        document.getElementById('q').value = b.getAttribute('data-q');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }));
    }).catch(e => toast(e.message, 'error'));
  }
})();
</script>
</body>
</html>
